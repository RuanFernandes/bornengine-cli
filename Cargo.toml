[package]
name = "bornengine-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Command-line tools for creating and managing BornEngine games"
license = "MIT"
repository = "https://github.com/RuanFernandes/bornengine-cli"
homepage = "https://github.com/RuanFernandes/bornengine-cli"
readme = "README.md"
keywords = ["game-engine", "typescript", "perry", "bornengine"]
categories = ["command-line-utilities", "game-development"]

[lib]
name = "bornengine_cli"
path = "src/lib.rs"

[[bin]]
name = "bornengine"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
console = "0.16"
dialoguer = { version = "0.12", default-features = false }
directories = "6"
indicatif = "0.18"
semver = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.9"
ureq = { version = "3", features = ["json"] }

[dev-dependencies]
tempfile = "3"
